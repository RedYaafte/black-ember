# Black Ember's canonical palette.
#
# Editor-specific themes map their native tokens to these semantic roles. Keep
# literal hex values here so every implementation shares the same visual core.

[meta]
name = "Black Ember"
slug = "black-ember"
version = 1
variant = "dark"

[ui]
background = "#171614"
background_deep = "#11100f"
surface = "#35312c"
overlay = "#625a50"
foreground = "#e8dfd0"
foreground_bright = "#fff7eb"
muted = "#a69a8b"
border = "#35312c"
selection = "#625a50"
cursor = "#e2a35f"
accent = "#bd8857"
accent_secondary = "#e2a35f"

[syntax]
comment = "#a69a8b"
keyword = "#bd8857"
function = "#e2a35f"
string = "#9caa76"
constant = "#e7bd72"
type = "#8da39a"
variable = "#e8dfd0"
property = "#d3a16e"
number = "#e7bd72"
operator = "#aaa094"
punctuation = "#8b8176"

[diagnostic]
error = "#bd5548"
warning = "#e7bd72"
info = "#8da39a"
hint = "#9caa76"

[vcs]
added = "#9caa76"
modified = "#e7bd72"
removed = "#bd5548"

[terminal.normal]
black = "#171614"
red = "#bd5548"
green = "#9caa76"
yellow = "#e7bd72"
blue = "#8b8176"
magenta = "#bd8857"
cyan = "#8da39a"
white = "#e8dfd0"

[terminal.bright]
black = "#625a50"
red = "#d86453"
green = "#b4c285"
yellow = "#f0ca7a"
blue = "#aaa094"
magenta = "#d3a16e"
cyan = "#9eb6ac"
white = "#fff7eb"
